name: ClanPvP Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ClanPvP (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ClanPvP/pom.xml

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package
        working-directory: ClanPvP

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: ClanPvP-Plugin
          path: ClanPvP/target/ClanPvP.jar
          if-no-files-found: error
          retention-days: 14
