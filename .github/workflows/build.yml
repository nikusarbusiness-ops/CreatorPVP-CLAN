name: ClanPvP Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ClanPvP/pom.xml

      - name: Build with Maven
        run: mvn --batch-mode clean package
        working-directory: ClanPvP

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: ClanPvP-Plugin
          path: ClanPvP/target/*.jar
          if-no-files-found: error
          retention-days: 14
